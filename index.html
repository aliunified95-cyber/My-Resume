<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="color-scheme" content="dark" />
    <!--app-head:start-->
    <title>Career Journey &amp; CV</title>
    <meta name="description" content="From frontline retail to digital commerce, treasury, logistics, and team leadership." />
    <!--app-head:end-->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Decide the motion mode before first paint (no flash).
      // 'static' for reduced-motion users or when the visitor switched animations off.
      (function () {
        var d = document.documentElement, mode = 'cinematic', n = navigator;
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        try {
          var saved = localStorage.getItem('motion-preference');
          mode = saved === 'static' || saved === 'cinematic' ? saved : reduce ? 'static' : 'cinematic';
        } catch (e) {
          mode = reduce ? 'static' : 'cinematic';
        }
        d.setAttribute('data-motion', mode);
        // Lighter effects on low-powered devices or when data saver is on.
        if ((n.hardwareConcurrency && n.hardwareConcurrency <= 4) || (n.deviceMemory && n.deviceMemory <= 4) || (n.connection && n.connection.saveData)) {
          d.setAttribute('data-perf', 'lite');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
